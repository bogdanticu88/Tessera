name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore Tessera.sln
      - name: Build
        run: dotnet build Tessera.sln -c Release --no-restore
      - name: Test
        run: dotnet test Tessera.sln -c Release --no-build
